name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JSON syntax (jq)
        run: for f in workflows/*.json; do jq empty "$f"; done
      - name: Workflow sanity (nodes, connections, no secrets)
        run: python3 scripts/validate_workflows.py

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          # example key only so the required-variable check passes
          sed -i "s/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=ci-dummy-key-not-secret/" .env
          docker compose config --quiet
          docker compose config | grep -q '127.0.0.1' # default bind stays loopback

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
